name: Moodle Plugin CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
        moodle-branch: ['MOODLE_502_STABLE']
        database: [mariadb]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          # If you are not using code coverage, keep "none". Otherwise, use "pcov" (Moodle 3.10 and up) or "xdebug".
          # If you try to use code coverage with "none", it will fallback to phpdbg (which has known problems).
          coverage: none

      - name: Initialise moodle-plugin-ci
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{secrets.github_token}}"} }'
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          pushd ci >/dev/null
            echo "> composer config repositories.repo-name vcs https://github.com/center-for-learning-management/moodle-psalm-plugin"
            composer config repositories.repo-name vcs https://github.com/center-for-learning-management/moodle-psalm-plugin
            echo "> composer require --dev center-for-learning-management/moodle-psalm-plugin dev-main@dev"
            composer require --dev center-for-learning-management/moodle-psalm-plugin dev-main@dev
          popd
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
          # Uncomment this to run Behat tests using the Moodle App.
          # MOODLE_APP: 'true'

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Copy/Paste Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcpd

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      # --- Fixers run before checks ---
      - name: Moodle Code Beautifier and Fixer
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcbf

      - name: Moodle Code Checker
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      # Custom ESLint fix step – runs directly on plugin source inside Moodle
      - name: PHP Lint --fix
        if: ${{ !cancelled() }}
        run: |
          cd ${{ github.workspace }}/moodle
          ./node_modules/.bin/eslint --fix public/local/experience/

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome --scss-deprecations

      - name: Upload Behat Faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: Behat Faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1

      # Copy the fixed files from the Moodle installation back to the plugin folder
      - name: Copy changes to repository
        if: ${{ !cancelled() }}
        run: |
          echo "Copying changed files from ${{ github.workspace }}/moodle/public/$(echo ${GITHUB_REPOSITORY}|cut -d/ -f2|sed s/^moodle-//|tr _ /)/. to ${{ github.workspace }}/plugin/."
          rsync -av ${{ github.workspace }}/moodle/public/$(echo ${GITHUB_REPOSITORY}|cut -d/ -f2|sed s/^moodle-//|tr _ /)/. ${{ github.workspace }}/plugin/.

      # Detect if any files were modified by the fixers
      - name: Check for changes
        id: check
        if: ${{ !cancelled() }}
        run: |
          cd plugin
          git add -A
          if git diff --cached --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            git diff --cached --name-only > ../changed_files.txt
            echo "Modified files:"
            cat ../changed_files.txt
          fi

      # Prepare the pull request body with the list of changed files
      - name: Prepare PR body
        if: steps.check.outputs.changes == 'true'
        run: |
          echo "PR_BODY<<EOF" >> $GITHUB_ENV
          echo "Moodle CI Fixes" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "The following files were modified by the CI process:" >> $GITHUB_ENV
          echo '```' >> $GITHUB_ENV
          cat changed_files.txt >> $GITHUB_ENV
          echo '```' >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # Create a minimal composer.json so Psalm can autodiscover the source
      - name: Prepare Psalm config
        if: ${{ !cancelled() }}
        run: |
          cd plugin
          cat > composer.json <<'EOF'
          {
              "name": "local/experience",
              "autoload": {
                  "classmap": ["."]
              }
          }
          EOF

      - name: Psalm Security Scan
        if: ${{ !cancelled() }}
        uses: docker://ghcr.io/psalm/psalm-security-scan
        with:
          INPUT_WORKING_DIR: plugin

      # Create pull request only if changes exist
      - name: Create Pull Request
        if: steps.check.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: CI Fixes
          title: Moodle CI Fixes
          body: ${{ env.PR_BODY }}
          branch: moodle-ci-fixes
          path: plugin

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1